name: Verify and build Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_preview:
        description: Publish the tested Windows ZIP as a GitHub prerelease
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  verify:
    name: Analyze and test app, core, and PDF converter
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check source-only publication policy
        run: python3 scripts/check_publication.py --history --revision "$GITHUB_SHA"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Run static checks and unit/widget tests
        run: bash scripts/verify.sh
      - name: Verify browser project storage
        run: CHROME_EXECUTABLE="$(command -v google-chrome)" flutter test --no-pub --platform chrome test/browser_project_storage_test.dart
      - name: Verify optional offline PDF converter
        run: |
          python3 -m venv .venv-pdf
          .venv-pdf/bin/python -m pip install -r scripts/import_pdf_requirements.txt
          .venv-pdf/bin/python -I scripts/test_import_pdf.py

  windows:
    name: Build and check portable Windows x64 app
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build native application and package complete portable ZIP
        run: ./scripts/build_windows_portable.ps1 -OutputDirectory dist
      - name: Launch application extracted from portable ZIP
        run: ./scripts/check_windows_portable.ps1 -ArchiveDirectory dist
      - name: Upload portable ZIP and SHA-256
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: open-ecad-windows-x64-portable
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Publish tested preview for direct download
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_preview))
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = ([regex]::Match((Get-Content pubspec.yaml -Raw), '(?m)^version:\s*(\S+)')).Groups[1].Value
          $tag = "v$version-preview.$env:GITHUB_RUN_NUMBER"
          $notesPath = Join-Path $env:RUNNER_TEMP 'open-ecad-preview-notes.md'
          @"
          Portable Windows x64 preview. Download the ZIP, extract the entire folder, then run ``open_ecad.exe``. No Flutter or Visual Studio installation is needed.

          Static analysis, application/core/PDF converter tests, and startup of the extracted ZIP passed in GitHub Actions. This prototype is unsigned; interactive testing on a desktop PC remains necessary.

          Existing ``.oecad`` projects and PDF/SVG export work directly. Importing a new PDF requires the optional Python converter described in the source documentation; it is not bundled.

          Source commit: $env:GITHUB_SHA
          Build: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          "@ | Set-Content -LiteralPath $notesPath -Encoding utf8
          $archives = @(Get-ChildItem dist -Filter '*.zip' -File)
          if ($archives.Count -ne 1) { throw 'Expected exactly one tested Windows ZIP.' }
          $assetName = 'open-ecad-windows-x64-portable.zip'
          $assetPath = Join-Path $env:RUNNER_TEMP $assetName
          Copy-Item -LiteralPath $archives[0].FullName -Destination $assetPath
          $digest = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$assetPath.sha256", "$digest  $assetName`n", [Text.Encoding]::ASCII)
          $assets = @($assetPath, "$assetPath.sha256")
          gh release create $tag --target $env:GITHUB_SHA --title "Open ECAD $version - Windows preview $env:GITHUB_RUN_NUMBER" --draft --notes-file $notesPath @assets
          if ($LASTEXITCODE -ne 0) { throw 'Uploading the tested preview failed.' }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the tested preview failed.' }
